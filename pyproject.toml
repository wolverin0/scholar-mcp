[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scholar-mcp"
version = "0.1.0"
description = "Scientific Literature Semantic Compiler & FastMCP Server powered by arXiv, OpenAlex, DuckDB, and Jev System One"
readme = "README.md"
authors = [{ name = "Gonzalo Gorbalan", email = "ggorbalan@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "duckdb>=1.0.0",
    "mcp>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
scholar = "scholar.cli:main"
scholar-mcp = "scholar.mcp.server:main"
